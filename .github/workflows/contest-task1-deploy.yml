name: Contest task 1 - deploy seekdb

on:
  workflow_dispatch:
  push:
    branches: [2026-competition]
    paths:
      - .github/workflows/contest-task1-deploy.yml
      - competition/task1/deploy.sh
      - competition/task1/verify.py

permissions:
  contents: read

jobs:
  deploy-and-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            competition/task1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL client
        run: python3 -m pip install -r competition/task1/requirements.txt
      - name: Deploy, verify SQL, and report telemetry
        run: bash competition/task1/deploy.sh
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-task1-deployment-${{ github.run_id }}
          path: competition/task1/evidence/
          retention-days: 14
